[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: tests that require a running Postgres database",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is enforced by the formatter
    "B008",  # function calls in argument defaults — required by FastAPI Depends/Query
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "F811"]    # pytest fixture shadowing and exception assertions
